name: Build patched mod

on:
  push:
    tags: ['mosslight-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Build and package the pinned source
        run: |
          python3 .github/scripts/build_patch.py
          python3 .github/scripts/package.py
          cp release-dist/SHA256SUMS "$RUNNER_TEMP/first-build.sha256"
      - name: Check repeatable clean builds
        run: |
          python3 .github/scripts/build_patch.py
          python3 .github/scripts/package.py
          cmp "$RUNNER_TEMP/first-build.sha256" release-dist/SHA256SUMS
      - name: Publish the immutable build
        if: startsWith(github.ref, 'refs/tags/mosslight-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/package.py --publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patched-mod-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 7
